<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https:/cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!--Bande noire-->
    <div class="top-banner">
        <p>
            Nous avons mis à jour notre <a href="#">politique de confidentialité</a> et notre <a href="#">politique d'usage des cookies</a> pour vous aider à comprendre concrètement comment pinterest utilise les données. <a href="#">En savoir plus</a>
        </p>
        <button>Compris !</button>
    </div>
    <!--Header-->
    <header class="navbar">
        <div class="logo">
            <i class="fa fa-pinterest"></i>
        </div>
        <div class="search">
            <i class="fa fa-search"></i>
            <input type="text" placeholder="Recherche">
        </div>
        <!--Menu-->
        <nav>
            <ul>
                <li>Accueil</li>
                <li>Abonnements</li>
            </ul>
        </nav>
        <!--profil-->
        <div class="profile">
            <span class="icon-profile">P</span>
            <span class="nom">Phillipe</span>
        </div>
        <!--icones-->
        <div class="icons">
            <i class="fa fa-commenting"></i>
            <i class="fa fa-bell"></i>
            <i class="fa fa-ellipsis-h"></i>
        </div>
    </header>
<!--Menu principale-->
<main class="grid">
    <div class="card">
        <img src="pont.png">
    </div>
    <div class="card tall">
        <img src="hotel.jpg">
    </div>
    <div class="card">
        <img src="came1.jpeg">
    </div>
    <div class="card wide">
        <img src="image1.png">
    </div>
    <div class="card">
        <img src="image2.png">
    </div>
    <div class="card tall">
        <img src="Image3.png">
    </div>
    <div class="card">
        <img src="Image4.png">
    </div>
    <div class="card wide">
        <img src="Image5.png">
    </div>
    <div class="card">
        <img src="Image6.png">
    </div>
</main>
    
</body>
</html>
